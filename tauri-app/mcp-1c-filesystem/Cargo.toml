[package]
name = "mcp-1c-filesystem"
version = "1.0.0"
edition = "2021"
description = "MCP-сервер: файловые операции в sandbox-каталоге (Rust)"
license = "MIT"

[[bin]]
name = "mcp-1c-filesystem"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
glob = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
