[package]
name = "mcp-1c-jvv"
version = "1.0.0"
edition = "2021"
description = "MCP-сервер: обнаружение платформ 1С и список баз из ibases.v8i (Rust)"
license = "MIT"

[[bin]]
name = "mcp-1c-jvv"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "5.0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
