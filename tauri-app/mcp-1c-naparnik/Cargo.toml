[package]
name = "mcp-1c-naparnik"
version = "1.0.0"
edition = "2021"
description = "MCP-сервер: 1С:Напарник (code.1c.ai) — ИИ-консультант по 1С (Rust)"
license = "MIT"

[[bin]]
name = "mcp-1c-naparnik"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
lazy_static = "1"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
